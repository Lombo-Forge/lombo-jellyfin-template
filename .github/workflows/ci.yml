name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/leak-check.sh
