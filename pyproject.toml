[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lombo-app"
version = "1.0.0"
description = "A Lombo-Forge app for Jellyfin."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []  # standard library only; add a dependency only when it earns its place

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lombo-app = "lombo_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
